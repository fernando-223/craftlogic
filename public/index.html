  <style>

    *,:before,:after{box-sizing:inherit}body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.55 Nunito,system-ui,sans-serif;min-height:100vh}h1,h2,h3,h4{font-family:Fredoka,system-ui,sans-serif;line-height:1.15;margin:0 0 .55em}h1{font-size:clamp(2.4rem,5vw,4rem)}h2{font-size:clamp(1.6rem,3vw,2.3rem)}h3{font-size:1.25rem}p{margin:0 0 1em}button,input,select,textarea{font:inherit}button{color:inherit}nav{position:sticky;top:0;z-index:10;display:flex;gap:6px;align-items:center;padding:10px max(18px,calc((100vw - 1180px)/2));background:var(--card);border-bottom:2px solid var(--line);box-shadow:0 4px 14px #26395908;flex-wrap:wrap}nav b{font:700 1.35rem Fredoka;margin-right:auto;white-space:nowrap}nav button{border:0;background:transparent;border-radius:99px;padding:7px 12px;color:var(--mut);font-weight:800;cursor:pointer}nav button:hover,nav button:focus-visible{background:var(--soft);color:var(--ink)}main{max-width:1180px;margin:auto;padding:32px 20px 64px}.hero{display:grid;grid-template-columns:1fr 1fr;gap:28px;align-items:center;padding:24px 0 42px}.tag{display:inline-flex;align-items:center;gap:6px;background:var(--if);border-radius:99px;padding:4px 13px;font-size:.88rem;font-weight:800;color:var(--pri);margin-bottom:14px}.hero-copy p{font-size:1.15rem;color:var(--mut);max-width:55ch}.panel{background:var(--card);border:2px solid var(--line);border-radius:18px;padding:20px;box-shadow:var(--shadow)}.auth{max-width:440px;margin:auto}.field{display:grid;gap:5px;margin-bottom:14px;font-weight:800}.field input,.field select,.field textarea{width:100%;border:2px solid var(--line);border-radius:10px;padding:10px 12px;color:var(--ink);background:var(--bg)}.field input:focus,.field select:focus,.field textarea:focus{outline:3px solid #2b74d955;border-color:var(--pri)}.btn{border:2px solid var(--line);background:var(--card);border-radius:11px;padding:9px 14px;font-weight:800;cursor:pointer;transition:transform .15s,filter .15s}.btn:hover{filter:brightness(1.06);tr ottom:1px solid var(--line)}.switch{display:inline-flex;align-items:center;gap:8px}.footer{text-align:center;color:var(--mut);padding:24px;font-size:.9rem}#dashboard,#lesson,#teacher,#collab{scroll-margin-top:90px}
    @media(max-width:800px){.hero,.lesson-grid{grid-template-columns:1fr}.hero{padding-top:10px}.world{min-height:250px}nav{gap:2px;padding-inline:12px}nav button{padding:6px 8px;font-size:.9rem}}@media(max-width:500px){body{font-size:16px}main{padding:20px 14px 50px}.panel{padding:15px}.section-head{align-items:start;flex-direction:column}.lesson-top{align-items:start}.island{font-size:2.8rem}.btn{padding:9px 11px}}@media(prefers-reduced-motion:reduce){*,*:before,*:after{scroll-behavior:auto!important;animation:none!important;transition:none!important}}
    .character{transition:transform .5s}.world.won .character{transform:translateX(34px)}.world.won .goal-object{transform:rotate(-16deg) scale(1.12)}.goal-object{transition:transform .45s}.world.failed .character{animation:shake .3s 2}@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
  </style>

<body>
  <nav aria-label="Navegación principal"><b>🌿 CraftLogic</b><span id="navActions" class="row"></span></nav>
  <main id="app" aria-live="polite"></main><div class="footer">Universidad de Panamá · Construye, programa y aprende jugando.</div>
  <div class="toast hidden" id="toast" role="status"></div>
  <script>
    const app=document.getElementById('app'), nav=document.getElementById('navActions');
    let state={user:null,data:null,lesson:null,blocks:[],room:null,theme:localStorage.getItem('craftlogic-theme')||'light'};
    document.documentElement.dataset.theme=state.theme;
    const el=(tag,cls,text)=>{const n=document.createElement(tag);if(cls)n.className=cls;if(text!==undefined)n.textContent=text;return n};
    const button=(label,cls,fn)=>{const b=el('button','btn '+(cls||''),label);b.type='button';b.onclick=fn;return b};
    const escapeHTML=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    async function api(url,opts={}){const res=await fetch('/api'+url,{credentials:'same-origin',headers:{'Content-Type':'application/json',...(opts.headers||{})},...opts});let data={};try{data=await res.json()}catch{}if(!res.ok)throw Error(data.error||'No pudimos completar la solicitud.');return data}
    let toastTimer;function toast(message){const node=document.getElementById('toast');node.textContent=message;node.classList.remove('hidden');clearTimeout(toastTimer);toastTimer=setTimeout(()=>node.classList.add('hidden'),3500)}
    function section(title,subtitle){const h=el('div','section-head');const d=el('div');d.append(el('h2','',title));if(subtitle)d.append(el('p','muted',subtitle));h.append(d);return h}
    function field(label,name,type='text',required=true){const l=el('label','field',label);const i=el('input');i.name=name;i.type=type;i.required=required;if(type==='password')i.minLength=8;if(type==='email')i.autocomplete='email';l.append(i);return l}
    function renderAuth(register=false){state.user=null;state.data=null;state.lesson=null;nav.replaceChildren(button('🌙 Contraste', '',toggleTheme));const hero=el('section','hero');const copy=el('div','hero-copy');copy.append(el('span','tag','Software educativo · 10 a 15 años'),el('h1','', 'Construye, programa y aprende jugando.'),el('p','', 'Explora un mundo virtual, resuelve misiones con lógica de programación y mira cómo tus ideas cobran vida.'));const teaser=el('div','panel');teaser.append(el('div','tag','Reto destacado · Condicionales'),el('h2','', '¿Tienes la llave?'),el('p','muted','Usa una condición: si encuentras la llave, la puerta se abre. Aprende secuencias, bucles, variables y más en siete módulos progresivos.'),el('div','world',''));const island=el('div','island');island.append(el('span','','🧒'),el('span','','🔑'),el('span','','🚪'));teaser.lastChild.append(island);const auth=el('section','panel auth');auth.append(el('h2','',register?'Crea tu cuenta':'¡Hola de nuevo!'),el('p','muted',register?'Guarda tu aventura y tu progreso.':'Inicia sesión para continuar tu aventura.'));const form=el('form');if(register)form.append(field('Nombre','name'),field('Correo electrónico','email','email'));else form.append(field('Correo electrónico','email','email'));form.append(field('Contraseña (mínimo 8 caracteres)','password','password'));let inviteField;if(register){const l=el('label','field','Voy a usar CraftLogic como');const s=el('select');s.name='role';[['student','Estudiante'],['teacher','Docente']].forEach(([v,t])=>{const o=el('option','',t);o.value=v;s.append(o)});inviteField=field('Código de invitación docente','inviteCode','password');inviteField.classList.add('hidden');inviteField.querySelector('input').autocomplete='off';inviteField.querySelector('input').required=false;l.append(s);form.append(l);s.onchange=()=>{const teacher=s.value==='teacher';inviteField.classList.toggle('hidden',!teacher);inviteField.querySelector('input').required=teacher};form.append(inviteField)}const submit=el('button','btn primary',register?'Crear cuenta':'Iniciar sesión');submit.type='submit';form.append(submit);form.onsubmit=async e=>{e.preventDefault();submit.disabled=true;try{const body=Object.fromEntries(new FormData(form));await api('/auth/'+(register?'register':'login'),{method:'POST',body:JSON.stringify(body)});await loadDashboard()}catch(err){toast(err.message)}finally{submit.disabled=false}};const toggle=button(register?'Ya tengo una cuenta':'Crear una cuenta','ghost',()=>renderAuth(!register));const note=el('p','small muted',register?'Las cuentas docentes requieren un código de invitación.':'No compartimos tu contraseña. La cuenta se guarda en la base de datos del proyecto.');auth.append(form,toggle,note);hero.append(copy,auth);app.replaceChildren(hero);}
    function toggleTheme(){state.theme=state.theme==='light'?'dark':'light';document.documentElement.dataset.theme=state.theme;localStorage.setItem('craftlogic-theme',state.theme)}
    function renderNav(){nav.replaceChildren(button('🏠 Mi aventura','',()=>loadDashboard()),button('🤝 Colaborar','',renderCollab));if(['teacher','admin'].includes(state.user.role))nav.append(button('👩‍🏫 Panel docente','',renderTeacher));nav.append(button('🌗 Contraste','',toggleTheme),button('Salir','',logout))}
    async function loadDashboard(){try{const data=await api('/me');state.user=data.user;state.data=data;renderNav();renderDashboard()}catch(err){if(err.message.includes('Inicia sesión')||err.message.includes('cuenta'))renderAuth(false);else{renderAuth(false);toast(err.message)}}}
    function renderDashboard(){const d=state.data,u=d.user;const done=new Set(d.progress.filter(p=>p.completed_at).map(p=>Number(p.module_id)));const scores=Object.fromEntries(d.progress.map(p=>[p.module_id,p.best_score]));const points=d.progress.reduce((n,p)=>n+Number(p.best_score||0),0);const top=el('section','');top.append(el('span','tag',u.role==='teacher'?'Espacio docente':'Tu aventura'),el('h1','',`¡Hola, ${u.name.split(' ')[0]}!`),el('p','muted',u.role==='teacher'?'Acompaña a tus estudiantes y comparte retos de programación.':'Elige una misión y sigue construyendo tu mundo, bloque a bloque.'));const stats=el('div','stat-grid');[[done.size+' / 7','módulos completados'],[points,'puntos acumulados'],[d.metrics.attempts,'intentos'],[d.metrics.wins,'retos superados'],[d.badges.length,'insignias']].forEach(([v,l])=>{const s=el('div','stat');s.append(el('strong','',v),el('span','muted small',l));stats.append(s)});top.append(stats);if(d.assignments.length){top.append(el('h3','','Retos de tu docente'));const items=el('div','cards');d.assignments.forEach(a=>{const card=el('article','panel');card.append(el('b','',`Módulo ${a.module_id} · ${a.teacher_name}`),el('p','muted',a.note||'Tu docente te asignó este módulo.'),button('Ir al reto','primary',()=>openLesson(a.module_id)));items.append(card)});top.append(items)}const mods=el('section','');mods.append(section('Tus siete módulos','Avanza a tu ritmo: tu progreso queda guardado automáticamente.'));const cards=el('div','cards');d.modules.forEach(m=>{const card=el('article','panel module-card');card.append(el('div','row spread'));card.firstChild.append(el('span','icon',''+m.icon),el('span','pill',done.has(m.id)?'✓ Completado':`Módulo ${m.id}`));card.append(el('h3','',m.title),el('p','',m.lesson),el('div','bar'));card.querySelector('.bar').append(el('i'));card.querySelector('.bar i').style.width=done.has(m.id)?'100%':scores[m.id]?scores[m.id]+'%':'0%';card.append(button(done.has(m.id)?'Volver a practicar':'Empezar misión','primary',()=>openLesson(m.id)));cards.append(card)});mods.append(cards);const rewards=el('section','');rewards.append(section('Tus insignias','Cada reto completado suma un nuevo logro.'));if(d.badges.length){const cards=el('div','cards');d.badges.forEach(b=>{const c=el('article','panel row');c.append(el('span','badge',''+b.icon));const copy=el('div');copy.append(el('h3','',b.title),el('p','muted',b.description));c.append(copy);cards.append(c)});rewards.append(cards)}else rewards.append(el('p','muted','Completa un módulo para ganar tu primera insignia.'));app.replaceChildren(top,mods,rewards)}
    async function openLesson(id){try{const {module}=await api('/modules/'+id);state.lesson=module;state.blocks=[];renderLesson()}catch(err){toast(err.message)}}
    function renderLesson(){const m=state.lesson;const page=el('section','');const head=el('div','lesson-top');head.append(button('← Volver a mis módulos','',()=>loadDashboard()),el('span','tag',`Módulo ${m.id} de 7 · ${m.title}`));page.append(head,el('h1','',m.story),el('p','muted',m.lesson));const panel=el('div','panel');panel.append(el('h2','',`🎯 Misión: ${m.goal}`));const grid=el('div','lesson-grid');const world=el('div','world');world.id='world';world.append(el('span','scene-caption','Tu mundo · listo para programar'));const island=el('div','island');island.append(el('span','character'),el('span','goal-object'));island.children[0].textContent=['🧒','🚶','🧙','🧑‍🚀','🧝','🧒','🏆'][m.id-1];island.children[1].textContent=m.id===3?'🚪':m.id===5?'⭐':m.id===7?'🎖️':'💎';world.append(island);const editor=el('div','builder');editor.append(el('h3','',m.id===7?'Cuestionario final':'Construye tu programa'));if(m.id===7){const quiz=el('div','quiz');m.quiz.forEach((q,qi)=>{const card=el('div','question');card.append(el('b','',`${qi+1}. ${q.q}`));q.choices.forEach((choice,ci)=>{const label=el('label','choice');const input=el('input');input.type='radio';input.name='q'+qi;input.value=ci;label.append(input,el('span','',choice));card.append(label)});quiz.append(card)});editor.append(quiz)}else{editor.append(el('p','muted small','Toca un bloque para añadirlo. Puedes cambiar el orden o quitarlo.'));const palette=el('div','palette');m.palette.forEach(kind=>{const b=el('button','block',m.labels[kind]);b.type='button';b.dataset.kind=kind;b.onclick=()=>{state.blocks.push(kind);drawProgram()};palette.append(b)});editor.append(el('b','small','Bloques disponibles'),palette,el('b','small','Tu programa'));const program=el('div','program');program.id='program';editor.append(program);drawProgram()}
      const feedback=el('div','feedback','Ejecuta tu solución para recibir retroalimentación.');feedback.id='feedback';const run=button(m.id===7?'Enviar respuestas':'▷ Ejecutar reto','primary',()=>submitAttempt());editor.append(feedback,el('div','row'));editor.lastChild.append(run);if(m.id<7)editor.lastChild.append(button('💡 Pista','',()=>toast('Pista: '+m.goal)));grid.append(world,editor);panel.append(grid);page.append(panel);app.replaceChildren(page)}
    function drawProgram(){const target=document.getElementById('program');if(!target)return;target.replaceChildren();if(!state.blocks.length){target.append(el('span','muted small','Añade aquí tus bloques.'));return}state.blocks.forEach((kind,index)=>{const row=el('div','program-row');row.append(el('span','',state.lesson.labels[kind]||kind));const up=el('button','', '↑');up.setAttribute('aria-label','Mover bloque arriba');up.disabled=index===0;up.onclick=()=>{[state.blocks[index-1],state.blocks[index]]=[state.blocks[index],state.blocks[index-1]];drawProgram()};const down=el('button','','↓');down.setAttribute('aria-label','Mover bloque abajo');down.disabled=index===state.blocks.length-1;down.onclick=()=>{[state.blocks[index+1],state.blocks[index]]=[state.blocks[index],state.blocks[index+1]];drawProgram()};const remove=el('button','','×');remove.setAttribute('aria-label','Quitar bloque');remove.onclick=()=>{state.blocks.splice(index,1);drawProgram()};row.append(up,down,remove);target.append(row)})}
    async function submitAttempt(){const m=state.lesson;let answers=[];if(m.id===7){for(let i=0;i<m.quiz.length;i++){const picked=document.querySelector(`input[name="q${i}"]:checked`);if(!picked)return toast('Responde todas las preguntas antes de enviar.');answers.push(Number(picked.value))}}try{const result=await api('/attempts',{method:'POST',body:JSON.stringify({moduleId:m.id,blocks:state.blocks,answers})});const node=document.getElementById('feedback');node.textContent=result.feedback+(result.success?` +${result.score} puntos`:'');node.style.background=result.success?'var(--soft)':'var(--else)';document.getElementById('world')?.classList.toggle('won',result.success);document.getElementById('world')?.classList.toggle('failed',!result.success);if(result.success){toast('¡Progreso guardado!');const next=button(m.id<7?'Continuar al siguiente módulo':'Volver al inicio','primary',()=>m.id<7?openLesson(m.id+1):loadDashboard());document.querySelector('.builder .row').replaceChildren(next)}}catch(err){toast(err.message)}}
    async function renderTeacher(){if(!state.user||!['teacher','admin'].includes(state.user.role))return;const page=el('section','');page.append(button('← Mi aventura','',()=>loadDashboard()),section('Panel docente','Asigna una misión a un estudiante y consulta el avance de quienes invitaste.'));const create=el('div','panel');create.append(el('h3','','Asignar un módulo'));const form=el('form','row');form.style.alignItems='end';const email=field('Correo del estudiante','email','email');const mod=el('label','field','Módulo');const select=el('select');state.data.modules.forEach(m=>{const o=el('option','',`Módulo ${m.id}: ${m.title}`);o.value=m.id;select.append(o)});select.name='moduleId';mod.append(select);const note=field('Mensaje para el estudiante','note');note.querySelector('input').required=false;const send=el('button','btn primary','Asignar reto');send.type='submit';form.append(email,mod,note,send);form.onsubmit=async e=>{e.preventDefault();try{await api('/assignments',{method:'POST',body:JSON.stringify(Object.fromEntries(new FormData(form)))});toast('Reto asignado.');form.reset();await renderTeacher()}catch(err){toast(err.message)}};create.append(form);const list=el('div','panel');list.append(el('h3','','Estudiantes y progreso'));try{const {students}=await api('/teacher/overview');if(!students.length)list.append(el('p','muted','Cuando asignes un reto, tus estudiantes aparecerán aquí.'));else{const table=el('table','table');const thead=el('thead');const tr=el('tr');['Estudiante','Correo','Módulos completados','Avance'].forEach(t=>tr.append(el('th','',t)));thead.append(tr);const tbody=el('tbody');students.forEach(s=>{const row=el('tr');[s.name,s.email,`${s.completed} de 7`].forEach(t=>row.append(el('td','',t)));const td=el('td');const bar=el('div','bar');bar.append(el('i'));bar.firstChild.style.width=Math.round(s.completed/7*100)+'%';td.append(bar);row.append(td);tbody.append(row)});table.append(thead,tbody);list.append(table)}}catch(err){toast(err.message)}page.append(create,list);app.replaceChildren(page)}
    function renderCollab(){if(!state.user)return renderAuth();const page=el('section','');page.append(button('← Mi aventura','',()=>loadDashboard()),section('Construyan en equipo','Crea una sala y comparte su código con tus compañeros. El registro de actividad se guarda en MySQL.'));const panel=el('div','panel');const row=el('div','row');const select=el('select');state.data.modules.forEach(m=>{const o=el('option','',`Módulo ${m.id}: ${m.title}`);o.value=m.id;select.append(o)});const create=button('✨ Crear sala','primary',async()=>{try{const r=await api('/rooms',{method:'POST',body:JSON.stringify({moduleId:Number(select.value)})});state.room=r.code;renderRoom()}catch(err){toast(err.message)}});row.append(select,create);panel.append(el('h3','','Empezar una sala'),row);const join=el('form','row');join.style.marginTop='22px';const code=field('Código de una sala','code');code.querySelector('input').maxLength=6;code.querySelector('input').style.textTransform='uppercase';const enter=el('button','btn','Unirme');enter.type='submit';join.append(code,enter);join.onsubmit=async e=>{e.preventDefault();try{const r=await api('/rooms/join',{method:'POST',body:JSON.stringify(Object.fromEntries(new FormData(join)))});state.room=r.code;renderRoom()}catch(err){toast(err.message)}};panel.append(join);page.append(panel);app.replaceChildren(page)}
    async function renderRoom(){if(!state.room)return renderCollab();const page=el('section','');page.append(button('← Colaborar','',()=>{state.room=null;renderCollab()}),section('Sala compartida',`Comparte este código con tus compañeros: ${state.room}`));const panel=el('div','panel');panel.append(el('span','tag',`Código ${state.room}`),el('h3','','Actividad del equipo'));const feed=el('ul','room-feed');feed.id='roomFeed';panel.append(feed);const form=el('form','row');const input=el('input');input.name='message';input.required=true;input.maxLength=240;input.placeholder='Comparte una idea con el equipo…';input.setAttribute('aria-label','Mensaje para el equipo');const send=el('button','btn primary','Enviar');send.type='submit';form.append(input,send);form.onsubmit=async e=>{e.preventDefault();try{await api('/rooms/'+state.room+'/events',{method:'POST',body:JSON.stringify({message:input.value})});input.value='';await refreshRoom()}catch(err){toast(err.message)}};panel.append(form);page.append(panel);app.replaceChildren(page);await refreshRoom()}
    async function refreshRoom(){try{const data=await api('/rooms/'+state.room);const feed=document.getElementById('roomFeed');if(!feed)return;feed.replaceChildren();if(!data.events.length)feed.append(el('li','muted','Aún no hay mensajes. ¡Empieza el equipo!'));data.events.forEach(e=>{const li=el('li');li.append(el('b','',e.name+': '),el('span','',e.message));feed.append(li)});feed.scrollTop=feed.scrollHeight}catch(err){toast(err.message)}}
    async function logout(){try{await api('/auth/logout',{method:'POST'});renderAuth(false)}catch(err){toast(err.message)}}
    loadDashboard();
  </script>
</body>
